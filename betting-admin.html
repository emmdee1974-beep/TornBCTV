<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TornBC TV — Betting Desk</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="index.html">TORN<span>BC</span> TV</a><nav class="navlinks"><a href="betting.html">Betting</a><a href="payouts.html">Payouts</a></nav></div></header><main><section class="section"><div class="wrap"><div class="eyebrow">PRIVATE BETTING DESK</div><h1>Manual payment & settlement</h1><p class="muted">This page is for the TornBC TV operator. It does not move Torn cash; it records payments you have independently confirmed and publishes the final payout ledger.</p><div class="bettingCard"><label>Admin secret<input id="secret" type="password" autocomplete="off"></label><button class="btn" id="load">LOAD BETS</button></div><div id="desk" style="display:none;margin-top:20px"><div class="bettingCard"><div class="eyebrow">BET QUEUE</div><div id="bets"></div></div><div class="bettingCard" style="margin-top:20px"><div class="eyebrow">SET WINNER</div><select id="winner"></select><button class="btn" id="setWinner" style="margin-top:10px">CLOSE EVENT & PUBLISH PAYOUTS</button><div id="msg" class="statusBox" style="margin-top:10px"></div></div></div></div></section></main><script>
let data=null;const $=id=>document.getElementById(id),money=n=>'$'+Number(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(method='GET',body){const h={'x-admin-secret':$('secret').value};if(body)h['content-type']='application/json';const r=await fetch('/api/betting/admin',{method,headers:h,body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){try{data=await api();$('desk').style.display='block';const pending=data.bets.filter(b=>b.status==='AWAITING_PAYMENT');$('bets').innerHTML='<h3>Awaiting payment ('+pending.length+')</h3>'+ (pending.length?'<table class="bettingTable"><thead><tr><th>Code</th><th>Bettor</th><th>Team</th><th>Amount</th><th></th></tr></thead><tbody>'+pending.map(b=>'<tr><td>'+esc(b.code)+'</td><td>'+esc(b.player_name)+' (#'+esc(b.player_id)+')</td><td>'+esc(b.team_id)+'</td><td>'+money(b.amount)+'</td><td><button data-code="'+esc(b.code)+'">CONFIRM PAID</button></td></tr>').join('')+'</tbody></table>':'<div class="statusBox ok">No unpaid bets.</div>');const teams=[...new Map(data.bets.map(b=>[b.team_id,b.team_id])).entries()];$('winner').innerHTML='<option value="">Choose winning team…</option>'+teams.map(([id])=>'<option value="'+esc(id)+'">'+esc(id)+'</option>').join('');document.querySelectorAll('[data-code]').forEach(b=>b.onclick=async()=>{await api('POST',{action:'confirm',code:b.dataset.code});load();});}catch(e){alert(e.message)}}$('load').onclick=load;$('setWinner').onclick=async()=>{if(!$('winner').value)return;try{await api('POST',{action:'winner',teamId:$('winner').value});$('msg').className='statusBox ok';$('msg').innerHTML='Winner recorded. <a href="payouts.html">Open the public payout ledger</a>.';}catch(e){$('msg').className='statusBox warn';$('msg').textContent=e.message}};
</script></body></html>
